name: Bug report
description: Report a reproducible problem using synthetic data.
body:
  - type: markdown
    attributes:
      value: Do not include Garmin keys, access tokens, export URIs, account IDs or health records. Report vulnerabilities through the Security tab.
  - type: input
    id: environment
    attributes:
      label: Version and environment
      description: Release or commit, OS, architecture and MCP client.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Operation, synthetic parameters, expected behavior and actual behavior. Redact any logs before posting.
    validations:
      required: true
